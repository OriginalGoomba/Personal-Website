<!DOCTYPE html>
<html lang="en" class="html" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>
  <meta name="description" content="Get in touch with questions, feedback, or project ideas using the contact form." />

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="site.webmanifest" />
  
  <link rel="shortcut icon" href="favicon.ico" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/extra.css" />
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <main class="page-content" aria-label="Content">
    <div class="w">

      <header>
        <ul class="horizontal-list">
          <li>
            <a href="index.html">home</a>
            &nbsp;&nbsp;
          </li>
          <li>
            <a href="contactme.html">contact</a>
            &nbsp;&nbsp;
          </li>
        </ul>
        <div class="dashed"></div>
        <h1>Contact</h1>
      </header>

      <p>Questions, feedback, or project ideas? Use the form below and I will get back to you as soon as I can.</p>

      <form action="https://formspree.io/f/mlekavqg" method="POST">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />
        <div class="field">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea name="message" id="message" rows="6"></textarea>
        </div>
        <div class="field">
          <input type="submit" value="Send Message" />
        </div>
      </form>

      <footer>
        <div class="dashed"></div>
        <ul class="horizontal-list">
          <li>
            <a href="index.html">home</a>
            &nbsp;&nbsp;
          </li>
          <li>
            <a href="contactme.html">contact</a>
            &nbsp;&nbsp;
          </li>
        </ul>
      </footer>

      <button aria-label="Toggle dark mode" aria-pressed="false" class="theme-toggle">
        <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <div class="credits">
        &copy;&nbsp;2025
        &nbsp;
        &bull;
        &nbsp;
        Theme&nbsp; <a href="https://github.com/abhinavs/moonwalk" target="_blank" rel="noopener noreferrer">Moonwalk</a>
      </div>

    </div>
  </main>
</body>
</html>
